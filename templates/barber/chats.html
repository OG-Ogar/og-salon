<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chats - OG's Salon</title>

    <script src="/static/theme-switch.js"></script>
    <link rel="stylesheet" href="/static/app.css">
    <script src="/static/app.js" defer></script>

    

<link rel="stylesheet" href="/static/messages.css">
<link rel="stylesheet" href="/static/ui.css">
<link rel="stylesheet" href="/static/theme.css">
<link rel="stylesheet" href="/static/image-viewer.css">
<script src="/static/image-viewer.js" defer></script>
</head>


<body class="barber-page modern-role-page modern-barber-page messaging-page chats-index-page">

<main class="barber-messages-page ui-page">

    <div class="barber-messages">


        <!-- =================================================
             HEADER
             ================================================= -->

        {{template "role-header" (navigation "barber" "chats" .)}}



        <!-- =================================================
             TITLE
             ================================================= -->

        <section class="messages-title-box">

            <h1>
                Chats
            </h1>

        </section>



        <!-- =================================================
             CHATS
             ================================================= -->

        {{if .Items}}

            <section
                class="chat-list"
                aria-label="Conversations"
            >

                {{range .Items}}

                    <a
                        class="chat-row"
                        href="/barber/chats/{{.CustomerID}}"
                    >


                        <!-- PHOTO -->

                        <span class="chat-row-avatar">

                            {{if .CustomerImage}}

                                <img
                                    src="{{.CustomerImage}}"
                                    alt="{{.Name}}"
                                    data-fullscreen-image
                                    srcset="{{imageSrcset .CustomerImage}}" sizes="56px" width="112" height="112" loading="lazy" decoding="async">

                            {{else}}

                                <span
                                    class="chat-avatar-fallback"
                                    aria-hidden="true"
                                >
                                    {{printf "%.1s" .Name}}
                                </span>

                            {{end}}

                        </span>



                        <!-- NAME + LAST MESSAGE -->

                        <span class="chat-row-body">

                            <span class="chat-row-head">

                                <span class="chat-row-name">
                                    {{.Name}}
                                </span>

                                <span class="chat-row-time">
                                    {{.LastAt}}
                                </span>

                            </span>

                            <span class="chat-row-message">
                                {{.LastText}}
                            </span>

                        </span>


                    </a>

                {{end}}

                {{template "list-pagination" .Pagination}}

            </section>

        {{else}}

            <div class="empty-messages">

                No chats yet.

            </div>

        {{end}}


    </div>

</main>

</body>

</html>
